<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DRAGON PIXEL QUEST</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="top-controls">
    <button id="btn-sfx" class="retro-btn">SFX: ON</button>
    <button id="btn-bgm" class="retro-btn">MUSICA: ON</button>
    <button id="btn-crt" class="retro-btn">CRT: ON</button>
  </div>

  <div id="game-wrapper" class="scanlines">
    <canvas id="gameCanvas" width="360" height="480"></canvas>
  </div>

  <div id="touch-controls">
    <div class="touch-group">
      <button class="touch-btn" id="t-left">◀</button>
      <button class="touch-btn" id="t-right">▶</button>
    </div>
    <button class="touch-btn fire" id="t-fire">FOGO</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
